name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: emit a blob from the Go encoder
        run: go test ./loro/ -run TestEmitForJSImport -v
      - name: install loro-crdt
        run: npm ci
        working-directory: testdata/gen
      - name: import the Go blob into loro-crdt
        run: node testdata/gen/validate_go.mjs

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz smoke (below-checksum decoders on malformed input)
        run: |
          set -e
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeBlock$' -fuzztime=30s
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeUpdates$' -fuzztime=15s
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeSnapshot$' -fuzztime=15s
          go test ./encoding/columnar/ -run='^$' -fuzz='^FuzzStrategies$' -fuzztime=20s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzBlobDecoders$' -fuzztime=15s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzDecodeHeader$' -fuzztime=15s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzLoroValue$' -fuzztime=15s
          go test ./encoding/kv/ -run='^$' -fuzz='^FuzzParseSSTable$' -fuzztime=15s
          go test ./encoding/lz4/ -run='^$' -fuzz='^FuzzDecompressFrame$' -fuzztime=15s
      - name: upload crashers on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
