name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

  interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: emit a blob from the Go encoder
        run: go test ./loro/ -run TestEmitForJSImport -v
      - name: install loro-crdt
        run: npm ci
        working-directory: testdata/gen
      - name: import the Go blob into loro-crdt
        run: node testdata/gen/validate_go.mjs

  matrix-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
        working-directory: integration/matrix
      - name: vet
        run: go vet ./...
        working-directory: integration/matrix
      - name: unit tests (in-process homeserver double)
        run: go test -race ./...
        working-directory: integration/matrix
      # The unit tests above cannot prove the transport works against a real
      # server: an earlier version passed them all while being rejected by
      # Dendrite. So the convergence demo runs against an actual homeserver on
      # every push, and fails the build if the two peers do not agree.
      - name: start Dendrite
        run: docker compose up -d
        working-directory: integration/matrix
      - name: wait for the homeserver
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8008/_matrix/client/versions >/dev/null; then
              echo "ready"; exit 0
            fi
            sleep 2
          done
          echo "homeserver did not come up"; docker compose logs; exit 1
        working-directory: integration/matrix
      - name: two peers converge over a real homeserver
        run: go run ./cmd/loro-matrix-demo
        working-directory: integration/matrix
      - name: homeserver logs on failure
        if: failure()
        run: docker compose logs --tail=100
        working-directory: integration/matrix
      - name: stop Dendrite
        if: always()
        run: docker compose down -v
        working-directory: integration/matrix

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz smoke (below-checksum decoders on malformed input)
        run: |
          set -e
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeBlock$' -fuzztime=30s
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeUpdates$' -fuzztime=15s
          go test ./loro/ -run='^$' -fuzz='^FuzzDecodeSnapshot$' -fuzztime=15s
          go test ./encoding/columnar/ -run='^$' -fuzz='^FuzzStrategies$' -fuzztime=20s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzBlobDecoders$' -fuzztime=15s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzDecodeHeader$' -fuzztime=15s
          go test ./encoding/change/ -run='^$' -fuzz='^FuzzLoroValue$' -fuzztime=15s
          go test ./encoding/kv/ -run='^$' -fuzz='^FuzzParseSSTable$' -fuzztime=15s
          go test ./encoding/lz4/ -run='^$' -fuzz='^FuzzDecompressFrame$' -fuzztime=15s
      - name: upload crashers on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
